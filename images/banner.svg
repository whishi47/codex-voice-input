<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- 背景圆 -->
  <circle cx="120" cy="110" r="90" fill="url(#bgGrad)"/>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#0c1020"/>
    </radialGradient>
    <linearGradient id="micGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4ea1ff"/>
    </linearGradient>
  </defs>

  <!-- 声波动画环 -->
  <circle cx="120" cy="110" r="70" stroke="#4ea1ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>
  <circle cx="120" cy="110" r="85" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 4" opacity="0.2"/>

  <!-- 麦克风图标 -->
  <g transform="translate(120, 110)">
    <!-- 底座线 -->
    <line x1="0" y1="38" x2="0" y2="55" stroke="url(#micGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-16" y1="55" x2="16" y2="55" stroke="url(#micGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- 弧形支架 -->
    <path d="M -24 -10 Q -28 10 -12 38" stroke="url(#micGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 24 -10 Q 28 10 12 38" stroke="url(#micGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

    <!-- 麦克风本体 -->
    <rect x="-16" y="-45" width="32" height="48" rx="16" fill="url(#micGrad)"/>

    <!-- 网孔纹理 -->
    <line x1="-8" y1="-32" x2="8" y2="-32" stroke="#0c1020" stroke-width="1.5" opacity="0.3"/>
    <line x1="-8" y1="-24" x2="8" y2="-24" stroke="#0c1020" stroke-width="1.5" opacity="0.3"/>
    <line x1="-8" y1="-16" x2="8" y2="-16" stroke="#0c1020" stroke-width="1.5" opacity="0.3"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#0c1020" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- 底部文字 -->
  <text x="120" y="210" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#e2e8f0" letter-spacing="2">VOICE INPUT</text>
</svg>
